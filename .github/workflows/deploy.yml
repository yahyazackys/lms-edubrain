name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: CI/CD ESD EDUBRAIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519_esd_edubrain
          chmod 600 ~/.ssh/id_ed25519_esd_edubrain
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy app with Docker
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519_esd_edubrain ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            export GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519_esd_edubrain'

            mkdir -p /home/apps/dev/esd-edubrain
            cd /home/apps/dev/esd-edubrain

            if [ ! -d ".git" ]; then
              git clone git@github.com:yahyazackys/lms-edubrain.git .
            else
              git reset --hard
              git clean -fd
              git pull origin main
            fi

            # Create .env file if not exists
            if [ ! -f ".env" ]; then
              cp .env.example .env
              # Set production values
              sed -i 's/APP_ENV=local/APP_ENV=production/' .env
              sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
              sed -i 's/DB_HOST=127.0.0.1/DB_HOST=mysql/' .env
              sed -i 's/DB_DATABASE=laravel/DB_DATABASE=esd_edubrain_db/' .env
              sed -i 's/DB_USERNAME=root/DB_USERNAME=admin/' .env
              sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
            fi

            docker compose down || true
            docker compose up -d --build

            sleep 15

            # Laravel setup commands
            docker compose exec esd-edubrain-app composer install --no-dev --optimize-autoloader
            docker compose exec esd-edubrain-app php artisan key:generate || true
            docker compose exec esd-edubrain-app php artisan config:cache
            docker compose exec esd-edubrain-app php artisan route:cache
            docker compose exec esd-edubrain-app php artisan view:cache
            docker compose exec esd-edubrain-app php artisan storage:link
            
            # Run migrations (optional, uncomment if needed)
            docker compose exec esd-edubrain-app php artisan migrate --seed --force
          EOF
