version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: esd-edubrain-app
        volumes:
            - .:/var/www/html
        networks:
            - proxy_net
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: esd-edubrain-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: esd_edubrain_db
            MYSQL_USER: admin
            MYSQL_PASSWORD: password
        ports:
            - "3307:3306"
        volumes:
            - esd-edubrain-dbdata:/var/lib/mysql
        networks:
            - proxy_net

    nginx:
        image: nginx:latest
        container_name: esd-edubrain-nginx
        ports:
            - "90:80" # nanti bisa diarahin ke Nginx Proxy Manager
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/html
        depends_on:
            - app
        networks:
            - proxy_net

volumes:
    esd-edubrain-dbdata:

networks:
    proxy_net:
        external: true
